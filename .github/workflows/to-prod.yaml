name: Upload faturamento.audita.app.br

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          #AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: npm install yarn -g && yarn install

      - name: Build
        run: yarn run build

      - name: Deploy Audita
        if: success()
        run: aws s3 sync ./dist/faturamento.audita.app.br/browser s3://${{ secrets.AWS_S3_BUCKET }}

      - name: AWS CloudFront Invalidate
        uses: badsyntax/github-action-aws-cloudfront@v1.0.1
        with:
          distribution-id: ${{ secrets.DISTRIBUITION_ID }}
          aws-region: 'us-east-1'
          origin-prefix: 'root'
          include-origin-prefix: true
          invalidate-paths: '/*'
          default-root-object: 'index.html'


